name: Static validation

# CI verifies source only, it never authenticates to Azure or changes infrastructure.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform, Ansible, and security
    runs-on: ubuntu-latest

    steps:
      # Immutable SHAs correspond to the release versions noted in each comment.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned validation tools
        run: python -m pip install "ansible-lint==26.8.0" "checkov==3.3.13"

      - name: Lint the Ansible playbook
        run: ansible-lint playbooks/nginx.yml

      - name: Scan Terraform security posture
        run: checkov -d . --framework terraform --compact
